<ng-template #content let-offcanvas>
  <div class="offcanvas-header">
    <div class="offcanvas-brand">Active <span>with Raph</span></div>
    <button
      type="button"
      class="menu-close"
      aria-label="Close menu"
      (click)="offcanvas.dismiss()"
    >
      <i class="las la-times la-2x" aria-hidden="true"></i>
    </button>
  </div>

  <div class="offcanvas-body">
    <nav class="offcanvas-nav" aria-label="Main">
      <a
        class="offcanvas-link"
        [ngClass]="{ 'offcanvas-link--selected': isHomeSelected }"
        [attr.aria-current]="isHomeSelected ? 'page' : null"
        routerLink="/home"
        (click)="offcanvas.dismiss()"
        >Home</a
      >
      <a
        class="offcanvas-link"
        [ngClass]="{ 'offcanvas-link--selected': isTrainSelected }"
        [attr.aria-current]="isTrainSelected ? 'page' : null"
        routerLink="/train"
        (click)="offcanvas.dismiss()"
        >Train</a
      >
      <a
        class="offcanvas-link"
        [ngClass]="{ 'offcanvas-link--selected': isNutritionSelected }"
        [attr.aria-current]="isNutritionSelected ? 'page' : null"
        routerLink="/nutrition"
        (click)="offcanvas.dismiss()"
        >Nutrition</a
      >
      <a
        class="offcanvas-link"
        [ngClass]="{ 'offcanvas-link--selected': isToolsSelected }"
        [attr.aria-current]="isToolsSelected ? 'page' : null"
        routerLink="/tools"
        (click)="offcanvas.dismiss()"
        >Tools</a
      >
      <a
        class="offcanvas-link"
        [ngClass]="{ 'offcanvas-link--selected': isMeSelected }"
        [attr.aria-current]="isMeSelected ? 'page' : null"
        routerLink="/me"
        (click)="offcanvas.dismiss()"
        >Me</a
      >
    </nav>
  </div>
</ng-template>

<div class="d-flex flex-row align-items-center">
  <nav class="horizontal-menu" aria-label="Main">
    <a
      class="menu-link"
      [ngClass]="{ 'menu-link--selected': isHomeSelected }"
      [attr.aria-current]="isHomeSelected ? 'page' : null"
      routerLink="/home"
      >Home</a
    >
    <a
      class="menu-link"
      [ngClass]="{ 'menu-link--selected': isTrainSelected }"
      [attr.aria-current]="isTrainSelected ? 'page' : null"
      routerLink="/train"
      >Train</a
    >
    <a
      class="menu-link"
      [ngClass]="{ 'menu-link--selected': isNutritionSelected }"
      [attr.aria-current]="isNutritionSelected ? 'page' : null"
      routerLink="/nutrition"
      >Nutrition</a
    >
    <a
      class="menu-link"
      [ngClass]="{ 'menu-link--selected': isToolsSelected }"
      [attr.aria-current]="isToolsSelected ? 'page' : null"
      routerLink="/tools"
      >Tools</a
    >
    <a
      class="menu-link"
      [ngClass]="{ 'menu-link--selected': isMeSelected }"
      [attr.aria-current]="isMeSelected ? 'page' : null"
      routerLink="/me"
      >Me</a
    >
  </nav>

  <button
    type="button"
    class="hamburger-menu"
    aria-label="Open menu"
    (click)="open(content)"
  >
    <i class="las la-bars la-2x" aria-hidden="true"></i>
  </button>
</div>
