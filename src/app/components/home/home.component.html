<div class="d-flex flex-column w-100 min-vh-100 align-items-center">
  <div class="home-header d-flex w-100 flex-column">
    <div class="home-header__runner">
      <img
        src="assets/images/runner-banner.webp"
        alt="Raph running in the rain"
        width="1087"
        height="1446"
      />
    </div>

    <div class="home-header__top w-100 d-flex p-4">
      <app-social-media-links></app-social-media-links>
      <div class="spacer"></div>
      <app-menu [isHomeSelected]="true"></app-menu>
    </div>

    <div class="home-header__hero w-100">
      <div class="home-header__text">
        <h1 class="home-title">
          <span class="home-title__main">Active</span>
          <span class="home-title__sub">with Raph</span>
        </h1>
        <p class="home-tagline">Lift. Run. Ride. Repeat.</p>
        <a
          class="home-cta btn-accent"
          href="https://www.instagram.com/activewithraph/"
          target="_blank"
          rel="noopener noreferrer"
          >Follow on Instagram</a
        >
      </div>
    </div>
  </div>

  <!-- Two doors: the same tile look as the earlier pillars, with a slim icon block. The first one is the main door. -->
  <section class="doors mb-5" aria-label="Where to begin">
    <a class="door door--main" routerLink="/start">
      <div class="door__photo">
        <!-- route icon: a start point, a path and a goal -->
        <svg class="door__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="6" cy="19" r="3" />
          <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
          <circle cx="18" cy="5" r="3" />
        </svg>
      </div>
      <div class="door__body">
        <h2 class="door__name">Start where you are</h2>
        <!-- placeholder text: write your own -->
        <p class="door__text">Get your numbers, learn to lift at home, choose your cardio and keep going.</p>
        <span class="door__more">Take the first step</span>
      </div>
    </a>

    <!-- TODO: add the route /holding-back and write the page -->
    <a class="door" routerLink="/holding-back">
      <div class="door__photo">
        <!-- question icon -->
        <svg class="door__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <path d="M12 17h.01" />
        </svg>
      </div>
      <div class="door__body">
        <h2 class="door__name">What's holding you back?</h2>
        <!-- placeholder text: write your own -->
        <p class="door__text">The doubts and taboos that keep people from starting.</p>
        <span class="door__more">Read why</span>
      </div>
    </a>
  </section>

  <app-footer class="w-100 mt-auto"></app-footer>
</div>
